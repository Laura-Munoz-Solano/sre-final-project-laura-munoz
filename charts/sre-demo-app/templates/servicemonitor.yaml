{{- if .Values.monitoring.enabled }}
# Tells the Prometheus Operator to scrape /metrics on every pod behind the Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sre-demo-app.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.prometheusRelease }}
spec:
  selector:
    matchLabels:
      {{- include "sre-demo-app.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      # Keep the endpoint label set by the app (the route), not the port name
      honorLabels: true
      interval: {{ .Values.monitoring.interval }}
{{- end }}
