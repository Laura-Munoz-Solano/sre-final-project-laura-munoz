name: SRE Final Project Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sre-demo-app

jobs:
  test:
    name: Run Tests and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Linting
        run: |
          cd app
          flake8 . --max-line-length=100

      - name: Run unit tests
        run: |
          cd app
          pytest -v

  helm-lint:
    name: Validate Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint the chart
        run: helm lint ./sre-app-chart

      - name: Render the templates
        run: helm template sre-app ./sre-app-chart > /dev/null

  deploy-test:
    name: Deploy to Test Cluster (kind)
    runs-on: ubuntu-latest
    needs: [test, helm-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sre-demo-app:ci ./app

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Load image into the cluster
        run: kind load docker-image sre-demo-app:ci --name ci

      - name: Install the chart (app only)
        run: |
          helm install sre-app ./sre-app-chart \
            --set image.tag=ci \
            --set monitoring.enabled=false \
            --wait --timeout 3m

      - name: Smoke test
        run: |
          kubectl -n sre-app port-forward svc/sre-demo-app-service 8080:5000 &
          sleep 5
          curl -f http://localhost:8080/healthz
          curl -f -X POST http://localhost:8080/api/orders
          curl -f http://localhost:8080/metrics | grep http_requests_total

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: deploy-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
