{{- if .Values.monitoring.enabled }}
# The Grafana sidecar loads any ConfigMap labelled grafana_dashboard="1".
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "sre-demo-app.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  sre-demo-app.json: |-
{{ .Files.Get "files/dashboard.json" | indent 4 }}
{{- end }}
