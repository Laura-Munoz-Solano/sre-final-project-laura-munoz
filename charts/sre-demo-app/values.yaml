# Default values for sre-demo-app.

replicaCount: 2

image:
  # Local image built with `minikube image build`. To use the image published
  # by the CI pipeline, set this to ghcr.io/<your-github-user>/sre-demo-app.
  repository: sre-demo-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Probability (0.0 - 1.0) that POST /api/orders fails. Used for failure injection.
errorRate: 0.0

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Monitoring objects. They need the Prometheus Operator CRDs, which are
# installed by kube-prometheus-stack. Set enabled=false on clusters without it.
monitoring:
  enabled: true
  # Scrape interval for the ServiceMonitor.
  interval: 15s
  # Must match the Helm release name of kube-prometheus-stack.
  prometheusRelease: monitoring
