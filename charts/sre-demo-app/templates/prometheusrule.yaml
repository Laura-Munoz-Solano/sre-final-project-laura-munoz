{{- if .Values.monitoring.enabled }}
# Alert rules live in files/alert-rules.yaml so that the Prometheus template
# syntax used in annotations does not clash with Helm templating.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sre-demo-app.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.prometheusRelease }}
spec:
{{ .Files.Get "files/alert-rules.yaml" | indent 2 }}
{{- end }}
