groups:
  - name: sre-demo-app
    rules:
      # Errors: more than 5% of requests are failing with 5xx.
      - alert: DemoAppHighErrorRate
        expr: |
          sum(rate(demo_http_requests_total{status=~"5.."}[2m]))
            /
          sum(rate(demo_http_requests_total[2m])) > 0.05
        for: 2m
        labels:
          severity: critical
          service: sre-demo-app
        annotations:
          summary: High HTTP 5xx error rate on sre-demo-app
          description: '{{ $value | humanizePercentage }} of requests failed over the last 2 minutes (threshold: 5%).'

      # Latency: the 95th percentile is above 1 second.
      - alert: DemoAppHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(demo_http_request_duration_seconds_bucket[2m])) by (le)
          ) > 1
        for: 2m
        labels:
          severity: warning
          service: sre-demo-app
        annotations:
          summary: High request latency on sre-demo-app
          description: 'p95 latency is {{ $value | humanizeDuration }} (threshold: 1s).'

      # Availability: Prometheus cannot scrape any instance of the app.
      - alert: DemoAppDown
        expr: absent(demo_app_info)
        for: 1m
        labels:
          severity: critical
          service: sre-demo-app
        annotations:
          summary: sre-demo-app is down
          description: No instance of sre-demo-app has reported metrics for 1 minute.

      # Stability: containers are restarting.
      - alert: DemoAppPodRestarting
        expr: increase(kube_pod_container_status_restarts_total{pod=~".*sre-demo-app.*"}[10m]) > 2
        labels:
          severity: warning
          service: sre-demo-app
        annotations:
          summary: sre-demo-app pod is restarting
          description: 'Pod {{ $labels.pod }} restarted more than twice in 10 minutes.'
