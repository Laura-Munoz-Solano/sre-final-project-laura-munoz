apiVersion: v1
kind: Namespace
metadata:
  name: sre-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-demo-app
  namespace: sre-app
  labels:
    app: sre-demo-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: sre-demo-app
  template:
    metadata:
      labels:
        app: sre-demo-app
      annotations: # Prometheus scrape annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: sre-demo-app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 5000
        env:
        - name: ERROR_RATE
          value: {{ .Values.errorRate | quote }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sre-demo-app-service
  namespace: sre-app
  labels:
    app: sre-demo-app
spec:
  type: NodePort
  selector:
    app: sre-demo-app
  ports:
  - port: 5000
    targetPort: 5000
